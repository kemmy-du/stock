<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F5F7" />
  <title>股析 StockInsight · 股票分析报告</title>
  <meta name="description" content="由 CodeBuddy 生成的静态股票分析报告站：行情、技术指标、财务摘要、新闻情绪与 AI 结论。" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='22'%20fill='%2322262B'/%3E%3Ctext%20x='50'%20y='68'%20font-size='52'%20text-anchor='middle'%20fill='white'%20font-family='sans-serif'%20font-weight='700'%3E%E6%9E%90%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <noscript>
    <div style="margin:16px;padding:16px;border:1px solid #d3d6dc;border-radius:10px;font:14px/1.6 -apple-system,'PingFang SC',sans-serif;color:#33383f;background:#fff">
      当前浏览器禁用了 JavaScript，页面数据无法加载。请在系统浏览器中开启 JavaScript 后重试。
    </div>
  </noscript>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">析</span>
        <span>股析 <small>STOCKINSIGHT</small></span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="打开菜单">菜单</button>
      <nav class="nav-links" id="nav-links" aria-label="主导航"></nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <section class="hero">
        <p class="eyebrow">CodeBuddy × 深度分析 × 新闻雷达</p>
        <h1>重点股票的突发动态，一屏掌握。</h1>
        <p>雷达持续追踪已覆盖标的的公告、业绩、异动与风险事件，按重要度排序；每份报告由 CodeBuddy 完成取数、技术指标计算与七层框架分析。不追逐噪音，只保留决策所需的信息层级。</p>
        <div class="hero-stats">
          <div class="stat"><div class="stat-value" id="stat-reports">—</div><div class="stat-label">已发布报告</div></div>
          <div class="stat"><div class="stat-value" id="stat-stocks">—</div><div class="stat-label">覆盖标的</div></div>
          <div class="stat"><div class="stat-value" id="stat-radar">—</div><div class="stat-label">雷达监控</div></div>
        </div>
      </section>

      <section aria-label="股票雷达">
        <div class="section-head">
          <h2>股票雷达</h2>
          <a class="more" href="library.html">进入报告库 →</a>
        </div>
        <div class="radar-status" id="radar-status">正在接入雷达…</div>
        <div class="radar-filters" id="radar-filters" role="group" aria-label="新闻分类筛选"></div>
        <div class="radar-list" id="radar-list">
          <div class="card radar-item"><div class="skeleton" style="height:88px"></div></div>
          <div class="card radar-item"><div class="skeleton" style="height:88px"></div></div>
          <div class="card radar-item"><div class="skeleton" style="height:88px"></div></div>
        </div>
      </section>

      <section aria-label="最新报告">
        <div class="section-head"><h2>最新报告</h2><a class="more" href="library.html">进入报告库 →</a></div>
        <div class="report-grid" id="report-grid">
          <div class="card report-card"><div class="skeleton" style="height:120px"></div></div>
          <div class="card report-card"><div class="skeleton" style="height:120px"></div></div>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script defer src="assets/js/common.js"></script>
  <script defer src="assets/js/charts.js"></script>
  <script defer src="assets/js/render.js"></script>
</body>
</html>
