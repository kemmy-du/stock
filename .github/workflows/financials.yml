name: Update financials snapshot

on:
  schedule:
    - cron: "0 23 * * *"      # 北京时间次日 07:00（每天）
    - cron: "30 10 * * 1-5"   # 北京时间 18:30（周一至周五）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: financials-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build snapshot
        run: python3 scripts/build_financials.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/financials.json)" ]; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials.json
          git commit -m "chore(financials): 更新财报快照"
          # 构建期间可能有其他提交（如 radar 流水线），先 rebase 再推，失败重试
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, retrying"
            sleep 20
          done
          echo "::error::快照推送连续失败，请检查远端 main 状态"
          exit 1
